<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GLOIX</title>

    <meta name="description" content="GLOIX. Una pregunta al día. Entras. Lees. Y te vas.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #ffffff;
            color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .content {
            max-width: 600px;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 42px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .tagline {
            margin: 0;
            font-size: 22px;
            line-height: 1.6;
            font-weight: 400;
        }

        .legal {
            padding: 25px 20px 30px;
            text-align: center;
            font-size: 13px;
        }

        .legal a {
            color: #555555;
            text-decoration: none;
            margin: 0 12px;
        }

        .legal a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }

            .tagline {
                font-size: 19px;
            }

            .legal a {
                display: block;
                margin: 10px 0;
            }
        }

</head>

    <main>
        <div class="content">
